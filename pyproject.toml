[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "short-factory"
version = "0.1.0"
description = "AI YouTube Shorts factory for relationship psychology content"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "celery[redis]>=5.4.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "boto3>=1.35.0",
    "openai>=1.57.0",
    "anthropic>=0.40.0",
    "praw>=7.8.0",
    "google-api-python-client>=2.154.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "python-multipart>=0.0.17",
    "structlog>=24.4.0",
    "numpy>=2.1.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "httpx>=0.28.0",
]

[project.scripts]
short-factory-api = "short_factory.api.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/short_factory"]

[tool.hatch.build.targets.wheel.force-include]
"src/short_factory/api/templates" = "short_factory/api/templates"
"src/short_factory/api/static" = "short_factory/api/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
